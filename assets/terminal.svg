<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" role="img" aria-label="Animated terminal running dotnet build, dotnet test and a deployment">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#c0caf5}
.p{fill:#bf91f3}.ok{fill:#38bdae}.m{fill:#7a83ad}
.l{opacity:0;animation:show 12s infinite both}
.l1{animation-name:a1}.l2{animation-name:a2}.l3{animation-name:a3}.l4{animation-name:a4}.l5{animation-name:a5}.l6{animation-name:a6}.l7{animation-name:a7}.l8{animation-name:a8}.l9{animation-name:a9}
@keyframes a1{0%,3%{opacity:0}4%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a2{0%,13%{opacity:0}14%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a3{0%,21%{opacity:0}22%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a4{0%,31%{opacity:0}32%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a5{0%,41%{opacity:0}42%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a6{0%,49%{opacity:0}50%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a7{0%,59%{opacity:0}60%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a8{0%,69%{opacity:0}70%,94%{opacity:1}95%,100%{opacity:0}}
@keyframes a9{0%,77%{opacity:0}78%,94%{opacity:1}95%,100%{opacity:0}}
.c{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.c{animation:none}}
</style>
<rect x="1" y="1" width="338" height="298" rx="10" fill="#1a1b27" stroke="#2f3549"/>
<circle cx="20" cy="20" r="5.5" fill="#f7768e"/><circle cx="38" cy="20" r="5.5" fill="#e0af68"/><circle cx="56" cy="20" r="5.5" fill="#9ece6a"/>
<text x="170" y="24" text-anchor="middle" class="m">~/work</text>
<text x="18" y="60" class="l l1"><tspan class="p">$</tspan> dotnet build</text>
<text x="18" y="84" class="l l2 m">Restoring packages...</text>
<text x="18" y="108" class="l l3 ok">Build succeeded. 0 errors</text>
<text x="18" y="138" class="l l4"><tspan class="p">$</tspan> dotnet test</text>
<text x="18" y="162" class="l l5 m">Running tests...</text>
<text x="18" y="186" class="l l6 ok">Passed! 0 failed</text>
<text x="18" y="216" class="l l7"><tspan class="p">$</tspan> kubectl rollout status api</text>
<text x="18" y="240" class="l l8 ok">deployment "api" rolled out</text>
<text x="18" y="270" class="l l9"><tspan class="p">$</tspan> <tspan class="c">_</tspan></text>
</svg>
